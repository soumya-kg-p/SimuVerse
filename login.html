<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in – SimuVerse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
</head><body>
<div class="auth">
  <aside><a class="logo" href="index.html">SimuVerse</a>
    <div><h1>Ready to level up?</h1><p>Sign in to unlock all three missions, earn XP and collect badges.</p></div>
    <span></span></aside>
  <main><div class="card">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="t-in" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="t-up" aria-selected="false">Create account</button>
    </div>
    <form id="f" novalidate>
      <div id="nameRow" hidden><label for="name">Name</label><input id="name" autocomplete="name"></div>
      <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
      <p id="err" role="alert" aria-live="polite"></p>
      <button class="btn" id="go" type="submit">Sign in</button>
    </form>
    <p class="small"><a href="index.html">Back to SimuVerse</a></p>
  </div></main>
</div>
<script src="assets/auth.js"></script>
<script>
const q=id=>document.getElementById(id), next=SimuAuth.safeNext(new URLSearchParams(location.search).get('next'));
let up=false;
if(SimuAuth.session()) location.replace(SimuAuth.base+next);
function mode(u){up=u;q('t-in').setAttribute('aria-selected',!u);q('t-up').setAttribute('aria-selected',u);
  q('nameRow').hidden=!u;q('go').textContent=u?'Create account':'Sign in';q('err').textContent='';
  q('pw').autocomplete=u?'new-password':'current-password';}
if(new URLSearchParams(location.search).get('mode')==='signup')mode(true);
q('t-in').onclick=()=>mode(false);q('t-up').onclick=()=>mode(true);
q('f').onsubmit=async e=>{e.preventDefault();q('err').textContent='';
  try{ if(up) await SimuAuth.signUp(q('name').value,q('email').value,q('pw').value);
       else await SimuAuth.signIn(q('email').value,q('pw').value);
       location.href=SimuAuth.base+next; }
  catch(x){q('err').textContent=x.message;}};
</script>
</body></html>
